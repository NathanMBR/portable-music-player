# Tauri's official publish workflow (https://v2.tauri.app/distribute/pipelines/github/): every push
# to master that passes Quality Assurance builds the Linux and Windows releases into a stable
# release, kept as a draft until it's published by hand. Its description, and latest.json's notes,
# which the app's update dialog shows, are the version's patch notes, written by hand (see Releases
# in AGENTS.md). macOS isn't a target of the player.
name: 'publish stable'

# Starts when Quality Assurance finishes on master, and builds only if it passed. A workflow_run
# runs from master's newest commit, so the build checks out and tags the commit QA tested instead.
on:
  workflow_run:
    workflows: ['Quality Assurance']
    types: [completed]
    branches:
      - master

jobs:
  publish-tauri:
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu with WebKitGTK 4.1, so the Linux build runs on as many systems as
        # possible: a build only runs where glibc is as new as the one it was built with.
        platform: ['ubuntu-22.04', 'windows-latest']

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # First, so a release without patch notes fails before anything is built.
      - name: read the patch notes
        id: patch-notes
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          notes_file="docs/changelog/v${version//./-}.md"
          if [ ! -f "$notes_file" ]; then
            echo "::error file=$notes_file::No patch notes for version $version: write $notes_file (see Releases in AGENTS.md)."
            exit 1
          fi
          # A random delimiter, so no line of the notes can end the output early.
          delimiter="NOTES_$(node -p "require('crypto').randomUUID()")"
          {
            echo "notes<<$delimiter"
            cat "$notes_file"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      # ALSA's headers build cpal, which plays the songs.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The frontend is built by tauri build, through beforeBuildCommand.
      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts, without which no updater JSON is uploaded.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Portable Music Player v__VERSION__'
          # Also latest.json's notes.
          releaseBody: ${{ steps.patch-notes.outputs.notes }}
          releaseDraft: true
          prerelease: false
          releaseCommitish: ${{ github.event.workflow_run.head_sha }}
          # The app's download of a portable build links to these names (download_url in updates.rs).
          releaseAssetNamePattern: '[mainBinaryName]_[version]_[platform]_[arch][setup][ext]'
          # The bare executables are the player's portable builds.
          uploadPlainBinary: true
          # latest.json, which the app's update check reads.
          uploadUpdaterJson: true
          # Updater artifacts are made only here, where the signing key is: a local tauri build has
          # none to sign them with.
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
