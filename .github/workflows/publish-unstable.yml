# Tauri's official publish workflow (https://v2.tauri.app/distribute/pipelines/github/): every push
# to development builds the Linux and Windows releases into an unstable pre-release. macOS isn't a
# target of the player. The run's id and attempt make its tag, title and file names unique, so
# builds of the same version don't land in one release or overwrite each other when downloaded,
# and "unstable" in every file name keeps a downloaded build from passing for a stable one.
name: 'publish unstable'

on:
  push:
    branches:
      - development

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ubuntu with WebKitGTK 4.1, so the Linux build runs on as many systems as
        # possible: a build only runs where glibc is as new as the one it was built with.
        platform: ['ubuntu-22.04', 'windows-latest']

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # ALSA's headers build cpal, which plays the songs.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The frontend is built by tauri build, through beforeBuildCommand.
      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts, without which no updater JSON is uploaded.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: 'v__VERSION__-unstable.${{ github.run_id }}.${{ github.run_attempt }}'
          releaseName: 'Chopi v__VERSION__ unstable ${{ github.run_id }}.${{ github.run_attempt }}'
          releaseBody: 'Unstable build of the development branch, at commit ${{ github.sha }}, for testing. Run the portable executable for your OS, or the AppImage on Linux, from any folder: nothing to install.'
          releaseDraft: false
          prerelease: true
          releaseAssetNamePattern: '[mainBinaryName]_[version]_unstable_[platform]_[arch][setup]_${{ github.run_id }}_${{ github.run_attempt }}[ext]'
          # latest.json, as in the stable releases, though the app checks only those.
          uploadUpdaterJson: true
          # Updater artifacts are made only here, where the signing key is: a local tauri build has
          # none to sign them with.
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # The bare executables are the player's portable builds, uploaded apart under names that end
      # in -portable, as the NSIS installer's end in -setup: the asset name pattern names every file
      # alike, so it can't mark them alone. --clobber replaces the file of an earlier attempt.
      - name: upload the portable executable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
          # Cargo's package name, which names the executable.
          EXECUTABLE_NAME: chopi
        run: |
          if [ "$RUNNER_OS" = Windows ]; then platform=windows; extension=.exe; else platform=linux; extension=; fi
          asset="${EXECUTABLE_NAME}_${VERSION}_unstable_${platform}_x64-portable_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}${extension}"
          cp "src-tauri/target/release/${EXECUTABLE_NAME}${extension}" "$asset"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .tag_name)
          gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
