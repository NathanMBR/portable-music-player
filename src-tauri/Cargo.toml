[package]
name = "chopi"
version = "0.1.0"
description = "A music player that can run without installation on Windows and Linux"
authors = ["Nathan Murillo"]
license = "MIT"
repository = "https://github.com/NathanMBR/portable-music-player"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chopi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-window-state = "2"
lofty = "0.25.5"
tauri-plugin-log = "2"
opus-pure = "0.2.5"
rodio = { version = "0.23", default-features = false }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "alac", "flac", "pcm", "adpcm", "vorbis", "isomp4", "ogg", "wav", "id3v1", "id3v2", "ape"] }
cpal = { version = "0.18", features = ["pulseaudio"] }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
